            let briefs = [];

    async function loadBriefs() {
      try {
        // Works on GitHub Pages / local HTTP server
        const res = await fetch('./data/briefs.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Fetch failed: ' + res.status);
        briefs = await res.json();
      } catch (e) {
        // Falls back when opened as file:// (browser blocks local fetch)
        console.warn('Using embedded data (file:// or offline). For live updates use a local server or GitHub Pages.', e.message);
        briefs = EMBEDDED_BRIEFS;
      }
      // Ensure newest first
      briefs.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      document.getElementById('detail-view').classList.add('hidden');
      container.classList.remove('hidden');

      if (!briefs.length) {
        document.getElementById('empty').classList.remove('hidden');
        return;
      }

      briefs.forEach((b, idx) => {
        const isToday = idx === 0;
        const nifty = b.summary.nifty;
        const changeClass = nifty.change_pct >= 0 ? 'positive' : 'negative';
        const changeSign = nifty.change_pct >= 0 ? '+' : '';
        const statusBadge = b.status === 'open' 
          ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] bg-emerald-500/15 text-emerald-400 border border-emerald-500/25">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> OPEN
             </span>`
          : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] bg-gray-500/15 text-gray-400 border border-gray-500/25">CLOSED</span>`;

        const card = document.createElement('div');
        card.className = `card bg-dark-800 border ${isToday ? 'border-blue-500/40' : 'border-dark-600'} rounded-2xl p-5 cursor-pointer`;
        card.onclick = () => showDetail(b.date);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="font-semibold text-sm">${formatDate(b.date)} · ${b.day}</span>
                ${statusBadge}
                ${isToday ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">LATEST</span>' : ''}
              </div>
              <p class="text-xs text-gray-400 line-clamp-1">${b.summary.headline}</p>
            </div>
            <div class="text-right shrink-0">
              <p class="text-xs text-gray-400">NIFTY</p>
              <p class="font-bold mono text-sm">${nifty.value.toLocaleString('en-IN')}</p>
              <p class="text-xs mono ${changeClass}">${changeSign}${nifty.change_pct.toFixed(2)}%</p>
            </div>
          </div>
          <div class="mt-3 pt-3 border-t border-dark-600 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-[10px] text-gray-500 uppercase tracking-wide">Top</span>
              <span class="text-xs font-medium text-emerald-400">${b.summary.top_performer.name}</span>
              <span class="text-[11px] mono positive">+${b.summary.top_performer.change_pct}%</span>
            </div>
            <span class="text-xs text-gray-500">View brief →</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showDetail(date) {
      const b = briefs.find(x => x.date === date);
      if (!b) return;

      document.getElementById('cards-container').classList.add('hidden');
      const detail = document.getElementById('detail-view');
      detail.classList.remove('hidden');

      const nifty = b.summary.nifty;
      const changeClass = nifty.change_pct >= 0 ? 'positive' : 'negative';
      const changeSign = nifty.change_pct >= 0 ? '+' : '';

      const driversHtml = b.drivers.map(d => `
        <div class="bg-dark-700 border border-dark-600 rounded-xl p-3.5">
          <p class="text-[10px] font-semibold tracking-wide mb-1 ${
            d.color === 'green' ? 'text-emerald-400' :
            d.color === 'red' ? 'text-red-400' :
            d.color === 'blue' ? 'text-blue-400' :
            d.color === 'amber' ? 'text-amber-400' : 'text-gray-400'
          }">${d.tag}</p>
          <p class="text-sm text-gray-300">${d.text}</p>
        </div>
      `).join('');

      const sectorsHtml = b.sectors.map(s => `
        <div class="bg-dark-700 border border-dark-600 rounded-xl p-3 text-center">
          <p class="text-[11px] text-gray-400 mb-0.5">${s.name}</p>
          <p class="text-sm font-medium ${s.bias === 'positive' ? 'positive' : s.bias === 'negative' ? 'negative' : 'text-gray-300'}">${s.status}</p>
        </div>
      `).join('');

      // Rich Top 5 Up / Down (matches your automation style) if available
      const upStocks = b.up_stocks || [];
      const downStocks = b.down_stocks || [];

      const upStocksHtml = upStocks.length ? upStocks.map((s, i) => `
        <div class="bg-dark-700 border border-dark-600 rounded-xl p-4 ${i < upStocks.length - 1 ? 'mb-3' : ''}">
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <p class="font-semibold text-sm text-emerald-400">${i + 1}. ${s.name} <span class="text-gray-500 font-normal text-xs">(${s.ticker})</span></p>
            <span class="text-xs mono positive shrink-0">${s.change_note || ''}</span>
          </div>
          <p class="text-xs text-gray-400 mb-1">${s.price_note || ''}</p>
          <p class="text-sm text-gray-300 mb-1.5"><span class="text-gray-500">Why:</span> ${s.reasoning || ''}</p>
          <p class="text-xs text-gray-400 mb-1"><span class="text-gray-500">News:</span> ${s.news || ''}</p>
          ${s.trend_note ? `<p class="text-xs text-gray-500">Trend: ${s.trend_note}</p>` : ''}
          ${s.chart ? `<p class="text-[11px] mt-1.5"><a href="${s.chart}" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300 underline underline-offset-2">${s.chart_label || 'View chart →'}</a></p>` : ''}
        </div>
      `).join('') : (b.focus_stocks?.strength || []).map(s => `
        <div class="flex justify-between py-2.5 border-b border-dark-600 last:border-0">
          <span class="text-sm">${s.name}</span>
          <span class="text-sm mono positive">${s.note}</span>
        </div>
      `).join('');

      const downStocksHtml = downStocks.length ? downStocks.map((s, i) => `
        <div class="bg-dark-700 border border-dark-600 rounded-xl p-4 ${i < downStocks.length - 1 ? 'mb-3' : ''}">
          <div class="flex items-start justify-between gap-2 mb-1.5">
            <p class="font-semibold text-sm text-red-400">${i + 1}. ${s.name} <span class="text-gray-500 font-normal text-xs">(${s.ticker})</span></p>
            <span class="text-xs mono negative shrink-0">${s.change_note || ''}</span>
          </div>
          <p class="text-xs text-gray-400 mb-1">${s.price_note || ''}</p>
          <p class="text-sm text-gray-300 mb-1.5"><span class="text-gray-500">Why:</span> ${s.reasoning || ''}</p>
          <p class="text-xs text-gray-400 mb-1"><span class="text-gray-500">News:</span> ${s.news || ''}</p>
          ${s.trend_note ? `<p class="text-xs text-gray-500">Trend: ${s.trend_note}</p>` : ''}
          ${s.chart ? `<p class="text-[11px] mt-1.5"><a href="${s.chart}" target="_blank" rel="noopener" class="text-blue-400 hover:text-blue-300 underline underline-offset-2">${s.chart_label || 'View chart →'}</a></p>` : ''}
        </div>
      `).join('') : (b.focus_stocks?.pressure || []).map(s => `
        <div class="flex justify-between py-2.5 border-b border-dark-600 last:border-0">
          <span class="text-sm">${s.name}</span>
          <span class="text-sm mono negative">${s.note}</span>
        </div>
      `).join('');

      const outlookHtml = b.outlook.map((o, i) => `
        <div class="flex gap-3">
          <span class="text-amber-400 font-bold shrink-0">${i + 1}.</span>
          <p class="text-sm text-gray-300">${o}</p>
        </div>
      `).join('');

      const overviewHtml = b.market_overview
        ? `<div class="bg-dark-800 border border-dark-600 rounded-2xl p-5 mb-6">
             <h3 class="text-sm font-semibold text-gray-300 mb-2">Market Overview</h3>
             <p class="text-sm text-gray-300 leading-relaxed">${b.market_overview}</p>
           </div>`
        : '';

      const globalHtml = b.global_cues
        ? `<div class="bg-dark-800 border border-dark-600 rounded-2xl p-4 mb-4">
             <p class="text-[10px] text-blue-400 font-semibold tracking-wide mb-1">GLOBAL CUES</p>
             <p class="text-sm text-gray-300">${b.global_cues}</p>
           </div>`
        : '';

      const fiiHtml = b.fii_dii
        ? `<div class="bg-dark-800 border border-dark-600 rounded-2xl p-4 mb-6">
             <p class="text-[10px] text-gray-400 font-semibold tracking-wide mb-1">FII / DII</p>
             <p class="text-sm text-gray-300">${b.fii_dii}</p>
           </div>`
        : '';

      document.getElementById('detail-content').innerHTML = `
        <div class="mb-6">
          <div class="flex items-center gap-2 mb-1">
            <h2 class="text-2xl font-bold">${formatDate(b.date)}</h2>
            <span class="text-sm text-gray-400">${b.day}</span>
            ${b.status === 'open' ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/25">OPEN</span>' : '<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-500/15 text-gray-400 border border-gray-500/25">CLOSED</span>'}
          </div>
          <p class="text-sm text-gray-400">${b.summary.headline}</p>
        </div>

        <!-- Snapshot -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="bg-dark-800 border border-dark-600 rounded-2xl p-4">
            <p class="text-xs text-gray-400">NIFTY 50</p>
            <p class="text-2xl font-bold mono mt-0.5">${nifty.value.toLocaleString('en-IN')}</p>
            <p class="text-sm mono ${changeClass}">${changeSign}${nifty.change.toFixed(2)} (${changeSign}${nifty.change_pct.toFixed(2)}%)</p>
          </div>
          <div class="bg-dark-800 border border-dark-600 rounded-2xl p-4">
            <p class="text-xs text-gray-400">SENSEX</p>
            <p class="text-2xl font-bold mono mt-0.5">${b.summary.sensex.value.toLocaleString('en-IN')}</p>
            <p class="text-sm mono ${b.summary.sensex.change_pct >= 0 ? 'positive' : 'negative'}">${b.summary.sensex.change_pct >= 0 ? '+' : ''}${b.summary.sensex.change_pct.toFixed(2)}%</p>
          </div>
        </div>

        ${overviewHtml}

        <!-- Top Performer highlight -->
        <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-2xl p-4 mb-6">
          <p class="text-[10px] text-emerald-400 font-semibold tracking-wide mb-1">TOP PERFORMER / RELATIVE STRENGTH</p>
          <p class="font-semibold">${b.summary.top_performer.name} <span class="mono positive text-sm">+${b.summary.top_performer.change_pct}%</span></p>
          <p class="text-sm text-gray-300 mt-0.5">${b.summary.top_performer.reason}</p>
        </div>

        <!-- Drivers -->
        <h3 class="text-sm font-semibold text-gray-300 mb-3">Key Drivers</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">${driversHtml}</div>

        ${globalHtml}
        ${fiiHtml}

        <!-- Sectors -->
        <h3 class="text-sm font-semibold text-gray-300 mb-3">Sector Pulse</h3>
        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-6">${sectorsHtml}</div>

        <!-- Top 5 Upward Stocks -->
        <h3 class="text-sm font-semibold text-emerald-400 mb-3">Section 1: Top 5 Upward Stocks</h3>
        <div class="mb-6">${upStocksHtml}</div>

        <!-- Top 5 Downward Stocks -->
        <h3 class="text-sm font-semibold text-red-400 mb-3">Section 2: Top 5 Downward Stocks</h3>
        <div class="mb-6">${downStocksHtml}</div>

        <!-- Outlook -->
        <h3 class="text-sm font-semibold text-gray-300 mb-3">Outlook & Takeaways</h3>
        <div class="bg-dark-800 border border-dark-600 rounded-2xl p-5 space-y-3.5 mb-6">${outlookHtml}</div>

        ${b.impact_next_day ? `
        <!-- Impact on Tomorrow -->
        <div class="bg-blue-500/10 border border-blue-500/30 rounded-2xl p-5 mb-6">
          <p class="text-[10px] text-blue-400 font-semibold tracking-wide mb-2">${b.impact_next_day.title || 'Impact on Tomorrow / Next Trading Day'}</p>
          <p class="text-sm text-gray-200 leading-relaxed mb-4">${b.impact_next_day.summary || ''}</p>
          <ul class="space-y-2.5 mb-4">
            ${(b.impact_next_day.key_points || []).map(p => `
              <li class="flex gap-2 text-sm text-gray-300">
                <span class="text-blue-400 shrink-0">→</span>
                <span>${p}</span>
              </li>
            `).join('')}
          </ul>
          <p class="text-xs font-medium text-blue-300 border-t border-blue-500/20 pt-3">
            Bias for next session: ${b.impact_next_day.bias_for_tomorrow || '—'}
          </p>
        </div>
        ` : ''}

        ${b.previous_day_note ? `<p class="text-xs text-gray-500 border-t border-dark-600 pt-4"><strong>Previous session:</strong> ${b.previous_day_note}</p>` : ''}

        <div class="text-[11px] text-gray-600 mt-6 space-y-1 border-t border-dark-600 pt-4">
          <p>Updated: ${new Date(b.updated_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })} IST</p>
          <p>Sources: NSE / BSE closing data, market wrap reports, public news wires. Charts suggested via Yahoo Finance / TradingView.</p>
          <p>For personal tracking & educational use only.</p>
        </div>
      `;
    }

    function showCards() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('cards-container').classList.remove('hidden');
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Init
    loadBriefs();
  </script>
</body>
</html>
